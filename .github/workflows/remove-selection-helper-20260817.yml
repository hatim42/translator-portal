name: Remove selection helper text

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-selection-helper-20260817.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove helper sentence
        shell: python
        run: |
          from pathlib import Path
          p = Path("translator-selection/index.html")
          text = p.read_text(encoding="utf-8")
          target = '<p class="profile-desc">اكتب اسمك فقط، وستدخل مباشرة إلى الاختيار وتُحفظ اختياراتك تلقائيًا.</p>'
          if target not in text:
              raise SystemExit("Target helper sentence was not found")
          p.write_text(text.replace(target, "", 1), encoding="utf-8")

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translator-selection/index.html
          git commit -m "Remove selection helper text"
          git push
