name: Remove selection helper text

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'Run selection helper cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove helper sentence
        shell: python
        run: |
          from pathlib import Path
          p = Path("translator-selection/index.html")
          text = p.read_text(encoding="utf-8")
          target = '<p class="profile-desc">اكتب اسمك فقط، وستدخل مباشرة إلى الاختيار وتُحفظ اختياراتك تلقائيًا.</p>'
          if target not in text:
              raise SystemExit("Target helper sentence was not found")
          p.write_text(text.replace(target, "", 1), encoding="utf-8")

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translator-selection/index.html
          git commit -m "Remove selection helper text"
          git push origin HEAD:main
