<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#075b4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>نظام إدارة المترجمين</title>
  <style>
    :root{--green:#075b4b;--dark:#043d33;--gold:#c89d3c;--paper:#fafaf7;--line:#dce4e0;--blue:#e8f3ff;--orange:#fff0df;--ink:#172622;--muted:#63716d;--danger:#a6403d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:800}.hidden{display:none!important}.top{background:linear-gradient(135deg,var(--dark),var(--green));color:#fff;padding:20px max(18px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border:2px solid #e9cf89;border-radius:50%;display:grid;place-items:center;color:#e9cf89;font-size:23px}.top h1{margin:0;font-size:20px}.top small{color:#e4efe9}.shell{max-width:1120px;margin:auto;padding:24px 16px 48px}.login{max-width:470px;margin:7vh auto;background:#fff;border:1px solid var(--line);box-shadow:0 15px 40px #002d2414;border-radius:24px;padding:30px}.login h2{color:var(--green);margin:0 0 8px}.login p,.muted{color:var(--muted);line-height:1.7}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:800}.field input,.field select,.field textarea{padding:12px;border:1px solid #cbd8d3;border-radius:12px;background:#fff}.primary{background:var(--green);color:#fff}.secondary{background:#fff;border:1px solid var(--green);color:var(--green)}.notice{margin-top:14px;padding:12px;border-radius:12px;background:#fff8e9;color:#73510c;font-size:14px;line-height:1.6}.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:center}.bar .who{margin-left:auto;color:var(--muted);font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.stat{padding:15px}.stat b{display:block;color:var(--green);font-size:24px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:19px;min-height:156px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.icon{font-size:30px;background:#edf7f3;padding:11px;border-radius:14px}.card h3{margin:0}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.card button{margin-top:auto}.panel{padding:18px;margin:16px 0}.panel h2{color:var(--green);margin:0 0 14px;font-size:19px}.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:700px}.table th,.table td{padding:11px 9px;text-align:right;border-bottom:1px solid var(--line)}.table th{color:var(--green);background:#f2f8f5}.tag{font-size:12px;padding:5px 8px;border-radius:99px;white-space:nowrap}.primary-tag{background:var(--blue);color:#075da1}.support-tag{background:var(--orange);color:#9a5710}.pending{background:#fff4cf;color:#805900}.approved{background:#e7f6eb;color:#24713b}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:13px}.danger{background:#fff0ee;color:var(--danger);border:1px solid #f1c4c1}.modal{position:fixed;inset:0;background:#00271e88;display:grid;place-items:center;padding:16px;z-index:20}.modal-box{max-width:560px;width:100%;background:#fff;border-radius:21px;padding:23px;max-height:90vh;overflow:auto}.modal-box h2{color:var(--green);margin-top:0}.shift-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123e34;color:#fff;padding:12px 16px;border-radius:12px;z-index:30;box-shadow:0 8px 25px #0004}.install{background:#fff8e7;color:#674c13;border:1px solid #ead291}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}@media(max-width:720px){.top{padding:15px 16px}.top h1{font-size:17px}.shell{padding:18px 12px}.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.bar .who{width:100%;margin-left:0}.card{min-height:135px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="mark">۞</div><div><h1>نظام إدارة المترجمين</h1><small>وكالة الشؤون الدعوية والإرشادية</small></div></div><span id="net">● متصل</span></header>
  <main class="shell">
    <section id="loginView" class="login">
      <h2>تسجيل الدخول</h2><p>استخدم اسم المستخدم وكلمة المرور المرسلة لك من المالك.</p>
      <form id="loginForm"><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" required /></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required /></div><button class="primary" type="submit">دخول إلى النظام</button></form>
      <p class="notice">نسيت كلمة المرور؟ تواصل مع المالك مباشرة ليصدر لك كلمة مرور جديدة. لا يوجد استرجاع تلقائي بالبريد.</p>
    </section>
    <section id="appView" class="hidden"></section>
  </main>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div><div id="toast" class="toast hidden"></div>
  <script>
  const translators=[
    ['shakeel','شكيل الرحمن','أساسي'],['masood','مسعود الرحمن','أساسي'],['suleiman','سليمان عبد الوهاب حنيف','أساسي'],['mustaqeem','محمد مستقيم','أساسي'],['alim','محمد عليم الدين يوسف','أساسي'],['suhail','سهيل أحمد شكيل أحمد','أساسي'],['irfan','محمد عرفان نور الدين','أساسي'],['binyamin','حافظ محمد بنيامين نجم','أساسي'],['qahhar','عبدالقهار بخت زرين','أساسي'],['saeed','محمد سعيد ولد رحمت كل','أساسي'],['amer','عامر صافي','أساسي'],['ubaid','عبيد الله عبد الغفور','أساسي'],['faizan','فيضان عالم','أساسي'],['anees','عبدالله أنيس الرحمن','أساسي'],['zakaria','محمد زكريا حاجي عطاالله','أساسي'],['hassam','حسام الدين محمد أمين','أساسي'],['kawsar','كوثر يوانديتيو بن وارتومو','أساسي'],['omarrais','عمر رئيس هشام الغازي','أساسي'],['agustiar','أغستيار نوغراها عبدالله','أساسي'],['bello','بللو عبدالله','أساسي'],['abdulhakim','عبدالحكيم عبدالله ميلافيا','أساسي'],['luqman','لقمان يعقوب أحمد','أساسي'],['fawaz','فواز عاقب محمد الراجي','أساسي'],['sharaf','شرف الدين محمد جامع','أساسي'],['yusuf','يوسف صديق البيد','أساسي'],['baraka','بركة الله شويف','أساسي'],
    ['shahnawaz','شاهنواز صادق محمد عبدالله','مساند'],['mehraj','معراج الدين بري','مساند'],['ameer','أمير أحمد ضمير أحمد','مساند'],['ikram','إكرام الدين ولي أحمد','مساند'],['safi','صفي الرحمن','مساند'],['ikramhaq','اكرام الحق بن انعام الحق','مساند'],['anis','أنيس الرحمن راعين','مساند'],['ismat','عبد الله عصمت الله','مساند'],['bilal','محمد بلال احمد ديسائي','مساند'],['waseem','وسيم أحمد عبد الرؤوف','مساند'],['luqman2','محمد لقمان عبد الستار','مساند'],['musa','بي محمد موسى صاحب','مساند'],['ibrahim','إبراهيم يعقوب باكاري','مساند'],['maqsood','حافظ مقصود احمد','مساند'],['idris','ادريس حامد صالح هرفه','مساند'],['khubab','خبيب أحمد زاهر أحمد','مساند'],['zia','ضياء الله محمد احسان','مساند'],['ajmal','أجمل حسين','مساند'],['sohail','سهيل فيضان الله','مساند'],['zaheer','محمد احمد ظهير','مساند']
  ].map(([username,name,group],i)=>({id:i+1,username,name,group,shift:i%2?'الوردية الثانية: 9 م – 3 ص':'الوردية الأولى: 5 م – 11 م',rest:['الجمعة','السبت','الأحد'][i%3],preferredShift:null,preferredRest:null,profile:null,missionDays:group==='مساند'?(i%7)+12:null}));
  const db={get(k,f){try{return JSON.parse(localStorage.getItem('tp_'+k))??f}catch{return f}},set(k,v){localStorage.setItem('tp_'+k,JSON.stringify(v))}};
  let state={user:null,requests:db.get('requests',[]),people:db.get('people',translators),adminActions:db.get('adminActions',[])};
  const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function persist(){db.set('requests',state.requests);db.set('people',state.people);db.set('adminActions',state.adminActions)}
  function toast(m){$('#toast').textContent=m;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
  function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.remove('hidden');$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}}function closeModal(){$('#modal').classList.add('hidden')}
  function tag(group){return `<span class="tag ${group==='مساند'?'support-tag':'primary-tag'}">${group}</span>`}
  function login(e){e.preventDefault();const u=$('#username').value.trim().toLowerCase(),p=$('#password').value; if(u==='owner'&&p==='e2e-owner'){state.user={role:'owner',name:'المالك'};return render()}const person=state.people.find(x=>x.username===u);if(person&&p===`e2e-${u}`){state.user={role:'translator',personId:person.id,name:person.name};return render()}toast('بيانات الدخول غير صحيحة')}
  function logout(){state.user=null;$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');$('#loginForm').reset()}
  function render(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden'); $('#appView').innerHTML=state.user.role==='owner'?ownerView():translatorView(); bind(); }
  function translatorView(){const p=state.people.find(x=>x.id===state.user.personId),mine=state.requests.filter(r=>r.personId===p.id),unread=state.adminActions.filter(x=>x.personId===p.id&&!x.read).length;return `<div class="bar"><button class="secondary" data-action="logout">خروج</button><div class="who">${esc(p.name)} · ${tag(p.group)}</div></div><section class="panel"><h2>وردية اليوم</h2><p><b>${esc(p.shift)}</b> · الراحة الأسبوعية: <b>${esc(p.rest)}</b></p><p class="muted">تظهر أي تعديلات تعتمدها الإدارة هنا مباشرة.</p></section><section class="grid"><article class="card"><span class="icon">◉</span><h3>الحضور والانصراف</h3><p>امسح بطاقة NFC أو رمز QR داخل نطاق العمل، ثم أكّد موقعك.</p><button class="primary" data-action="attendance">تسجيل الحضور</button></article><article class="card"><span class="icon">▣</span><h3>الإجازات والاستئذان</h3><p>طلب إجازة أو حضور متأخر أو انصراف مبكر.</p><button class="primary" data-action="leave">رفع طلب</button></article><article class="card"><span class="icon">↔</span><h3>تغيير التوزيع</h3><p>طلب تغيير وردية أو يوم الراحة فقط.</p><button class="primary" data-action="change">رفع طلب تغيير</button></article><article class="card"><span class="icon">▤</span><h3>تسجيل الإحصاء</h3><p>سجل إحصاءك اليومي ليظهر للمالك.</p><button class="primary" data-action="stat">تسجيل الإحصاء</button></article><article class="card"><span class="icon">✓</span><h3>التحقق من المكافأة</h3><p>تظهر لك حالة المكافأة عند اعتمادها.</p><button class="secondary" data-action="reward">التحقق الآن</button></article><article class="card"><span class="icon">!</span><h3>التنبيهات والإجراءات</h3><p>${unread?`لديك ${unread} تنبيه جديد.`:'لا توجد تنبيهات جديدة.'}</p><button class="secondary" data-action="notices">عرض التنبيهات</button></article><article class="card"><span class="icon">↓</span><h3>تثبيت التطبيق</h3><p>ثبّت الموقع في الصفحة الرئيسية ليعمل كالتطبيق.</p><button class="install" data-action="install">طريقة التثبيت</button></article></section><section class="panel"><h2>طلباتي</h2>${requestTable(mine,false)}</section>`}
  function ownerView(){const pending=state.requests.filter(r=>r.status==='معلّق'),support=state.people.filter(p=>p.group==='مساند'),done=support.filter(p=>p.missionDays>=20).length;return `<div class="bar"><button class="secondary" data-action="logout">خروج</button><button class="primary" data-action="export">تحميل النسخة الاحتياطية</button><div class="who">لوحة المالك</div></div><section class="summary"><div class="stat">المترجمون<b>${state.people.length}</b></div><div class="stat">طلبات معلقة<b>${pending.length}</b></div><div class="stat">مساندون أكملوا 20 يومًا<b>${done}/20</b></div><div class="stat">حالات موزعة<b>${state.people.length}</b></div></section><section class="grid"><article class="card"><span class="icon">▦</span><h3>التوزيع الشهري</h3><p>عدّل الوردية والراحة مباشرة، أو حمّل نموذج إكسل.</p><button class="primary" data-action="distribution">فتح التوزيع</button></article><article class="card"><span class="icon">☷</span><h3>طلبات المترجمين</h3><p>راجع طلبات تغيير الوردية والراحة والإجازات.</p><button class="primary" data-action="requests">مراجعة الطلبات</button></article><article class="card"><span class="icon">⚑</span><h3>الإجراءات الإدارية</h3><p>إصدار لفت نظر أو طلب إفادة مع إشعار المترجم.</p><button class="primary" data-action="admin">فتح الإجراءات</button></article></section><section class="panel"><h2>الطلبات المعلقة</h2>${requestTable(pending,true)}</section>`}
  function requestTable(rows,owner){if(!rows.length)return '<p class="muted">لا توجد طلبات.</p>';return `<div class="table-wrap"><table class="table"><thead><tr><th>المترجم</th><th>الطلب</th><th>التفاصيل</th><th>الحالة</th>${owner?'<th>إجراء</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>${esc(r.detail)}</td><td><span class="tag ${r.status==='معتمد'?'approved':'pending'}">${r.status}</span></td>${owner?`<td class="actions"><button class="primary" data-approve="${r.id}">اعتماد</button><button class="danger" data-reject="${r.id}">رفض</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
  function formRequest(kind){const isChange=kind==='change';modal(`<h2>${isChange?'طلب تغيير التوزيع':'رفع طلب'}</h2><form id="requestForm"><div class="field"><label>النوع</label><select id="rtype">${isChange?'<option>تغيير الوردية</option><option>تغيير الراحة الأسبوعية</option>':'<option>إجازة</option><option>حضور متأخر</option><option>انصراف مبكر</option>'}</select></div><div class="field"><label>التفاصيل</label><textarea id="rdetail" required placeholder="اكتب التاريخ والسبب أو الاختيار المطلوب"></textarea></div><div class="actions"><button class="primary">إرسال للمالك</button><button type="button" class="secondary" data-close>إلغاء</button></div></form>`);$('#requestForm').onsubmit=e=>{e.preventDefault();const p=state.people.find(x=>x.id===state.user.personId);state.requests.unshift({id:Date.now(),personId:p.id,name:p.name,type:$('#rtype').value,detail:$('#rdetail').value,status:'معلّق'});persist();closeModal();render();toast('تم إرسال الطلب إلى المالك')};bindModal()}
  function attendance(){modal(`<h2>تسجيل الحضور</h2><p class="muted">في النسخة الفعلية يفتح هذا المسار من بطاقة NFC أو رمز QR، ويتحقق من الموقع والوقت. عند ضعف الإنترنت يحفظ الطلب محليًا ويرسله عند الاتصال.</p><div class="notice">وضع الاختبار: تم التحقق من نافذة الحضور والموقع داخل النطاق.</div><div class="actions"><button class="primary" id="confirmAttend">تأكيد الحضور</button><button class="secondary" data-close>إغلاق</button></div>`);$('#confirmAttend').onclick=()=>{closeModal();toast('تم تسجيل الحضور بنجاح')};bindModal()}
  function openDistribution(){modal(`<h2>التوزيع الشهري</h2><p class="muted">الأزرق: أساسي · البرتقالي: مساند. تُرحّل هذه البيانات للشهر التالي إن لم تعدّلها.</p><div class="actions"><button class="secondary" data-action="template">تحميل نموذج إكسل</button><button class="primary" data-action="saveDist">حفظ التوزيع</button><button class="secondary" data-close>إغلاق</button></div><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الفئة</th><th>الوردية</th><th>الراحة</th><th>المساند</th></tr></thead><tbody>${state.people.map(p=>`<tr><td>${esc(p.name)}</td><td>${tag(p.group)}</td><td><select data-shift="${p.id}"><option ${p.shift.includes('الأولى')?'selected':''}>الوردية الأولى: 5 م – 11 م</option><option ${p.shift.includes('الثانية')?'selected':''}>الوردية الثانية: 9 م – 3 ص</option></select></td><td><select data-rest="${p.id}">${['الجمعة','السبت','الأحد'].map(x=>`<option ${p.rest===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${p.group==='مساند'?`${p.missionDays}/20 يومًا`: '—'}</td></tr>`).join('')}</tbody></table></div>`);bindModal()}
  function approve(id,status){const r=state.requests.find(x=>x.id===Number(id));r.status=status;if(status==='معتمد'&&(r.type==='تغيير الوردية'||r.type==='تغيير الراحة الأسبوعية')){const p=state.people.find(x=>x.id===r.personId);if(r.type==='تغيير الوردية')p.shift='الوردية الثانية: 9 م – 3 ص';else p.rest='السبت'}persist();render();toast(status==='معتمد'?'تم الاعتماد وتحديث التوزيع':'تم رفض الطلب')}
  function adminAction(){modal(`<h2>إجراء إداري</h2><form id="adminForm"><div class="field"><label>المترجم</label><select id="aperson">${state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>الإجراء</label><select id="atype"><option>لفت نظر</option><option>طلب إفادة</option><option>استدعاء</option><option>محضر انسحاب</option></select></div><div class="field"><label>التفاصيل</label><textarea id="adetail" required></textarea></div><button class="primary">إصدار وإشعار المترجم</button></form>`);$('#adminForm').onsubmit=e=>{e.preventDefault();state.adminActions.unshift({personId:Number($('#aperson').value),type:$('#atype').value,detail:$('#adetail').value,read:false});persist();closeModal();toast('تم إصدار الإجراء وإشعار المترجم')};bindModal()}
  function install(){modal(`<h2>تثبيت الموقع كتطبيق</h2><p><b>أندرويد:</b> افتح القائمة في المتصفح ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p><p><b>آيفون:</b> افتح رابط الموقع في Safari ثم اضغط زر المشاركة واختر «إضافة إلى الشاشة الرئيسية».</p><button class="primary" data-close>تم</button>`);bindModal()}
  function bindModal(){document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);const t=$('[data-action="template"]');if(t)t.onclick=()=>{const csv='الاسم,الفئة,الوردية,الراحة\n'+state.people.map(p=>`${p.name},${p.group},${p.shift},${p.rest}`).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='نموذج-التوزيع.csv';a.click()};const save=$('[data-action="saveDist"]');if(save)save.onclick=()=>{state.people.forEach(p=>{p.shift=document.querySelector(`[data-shift="${p.id}"]`).value;p.rest=document.querySelector(`[data-rest="${p.id}"]`).value});persist();closeModal();render();toast('تم حفظ التوزيع وترحيله للشهر القادم')}}
  function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='logout')logout();if(a==='leave'||a==='change')formRequest(a);if(a==='attendance')attendance();if(a==='stat')toast('تم حفظ إحصاء تجريبي لليوم');if(a==='reward')toast('لا توجد مكافأة معلقة');if(a==='notices'){const p=state.user.personId;state.adminActions.filter(x=>x.personId===p).forEach(x=>x.read=true);persist();modal(`<h2>التنبيهات والإجراءات</h2>${state.adminActions.filter(x=>x.personId===p).map(x=>`<p><b>${x.type}</b><br>${esc(x.detail)}</p>`).join('<hr class="divider">')||'<p class="muted">لا توجد إجراءات.</p>'}`);bindModal()}if(a==='install')install();if(a==='distribution')openDistribution();if(a==='requests')$('#appView').querySelector('.panel:last-child').scrollIntoView({behavior:'smooth'});if(a==='admin')adminAction();if(a==='export'){const safe={generatedAt:new Date().toISOString(),people:state.people.map(({username,...p})=>p),requests:state.requests,adminActions:state.adminActions};const file=new Blob([JSON.stringify(safe,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(file);l.download='translator-backup.json';l.click();toast('تم تنزيل نسخة احتياطية لا تحتوي كلمات مرور')}});document.querySelectorAll('[data-approve]').forEach(x=>x.onclick=()=>approve(x.dataset.approve,'معتمد'));document.querySelectorAll('[data-reject]').forEach(x=>x.onclick=()=>approve(x.dataset.reject,'مرفوض'))}
  $('#loginForm').addEventListener('submit',login);window.addEventListener('online',()=>{$('#net').textContent='● متصل';toast('تمت استعادة الاتصال')});window.addEventListener('offline',()=>{$('#net').textContent='● يعمل دون اتصال'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
  // Local E2E harness only: never activates on the published GitHub Pages domain.
  const e2eUser=new URLSearchParams(location.search).get('e2e');
  if(location.hostname==='terminal.local'&&e2eUser){const person=state.people.find(x=>x.username===e2eUser);if(e2eUser==='owner')state.user={role:'owner',name:'المالك'};else if(person)state.user={role:'translator',personId:person.id,name:person.name};if(state.user)render()}
  </script>
</body></html>
